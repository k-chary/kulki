name: Release

# Run by hand from the Actions tab: "Use workflow from" is the version tag to release, e.g.
# v0.4.0. Main already ran the full suite for that commit before tagging it, so this only
# builds the installers and attaches them to a draft GitHub Release to review and publish.
on:
  workflow_dispatch:

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check that a version tag was chosen
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::Run this workflow from a version tag (Use workflow from: Tags), not from a branch."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/tauri-deps
      - run: npm ci
      # The tag is the version: stamp it into the app's version files for this build.
      - name: Stamp the tag's version
        shell: bash
        run: node scripts/release.ts stamp "$GITHUB_REF_NAME"
      # The installed app only accepts updates signed with this key; see README, "Updates".
      - name: Check updater signing is set up
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (README, Updates)."
            exit 1
          fi
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still the placeholder (README, Updates)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kulki ${{ github.ref_name }}
          releaseBody: Instalatory dla Windows, macOS i Linuksa.
          releaseDraft: true
          # Signed update bundles and latest.json, merged across the matrix jobs.
          uploadUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}
