name: Release

# A release is a version tag such as v0.1.0, pushed by hand. The full suite must pass
# before any installer is built; the result is a draft GitHub Release to review and publish.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  version:
    name: Tag matches the app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # versions.test.ts keeps package.json, Cargo.toml and tauri.conf.json in step;
      # this keeps the tag in step with them, so v0.2.0 never ships 0.1.0 installers.
      - name: Compare the tag with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version. Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json first."
            exit 1
          fi

  suite:
    name: Full suite
    needs: version
    uses: ./.github/workflows/full-suite.yml

  installers:
    name: Installer (${{ matrix.name }})
    needs: suite
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/tauri-deps
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kulki ${{ github.ref_name }}
          releaseBody: Instalatory dla Windows, macOS i Linuksa.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
