name: Release

# Builds the Windows, macOS and Linux installers for a version tag, attaches them to its
# GitHub Release and publishes it. main.yml calls this after you approve the tag on your
# phone; it can also be run by hand from the Actions tab with a tag name (empty means the
# latest tag). Main already ran the full suite for the tagged commit, so none runs here.
on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to release, e.g. v0.4.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v0.4.0 (empty means the latest tag)
        type: string
        required: false
        default: ''

jobs:
  prepare:
    name: Pick the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::There is no tag named '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Windows only for now: only the NSIS installer is built (it is also what the updater
  # downloads), not the .msi.
  installers:
    name: Installer (Windows)
    needs: prepare
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      # The tag is the version: stamp it into the app's version files for this build.
      - name: Stamp the tag's version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release.ts stamp "$TAG"
      # The installed app only accepts updates signed with this key; see README, "Updates".
      - name: Check updater signing is set up
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (README, Updates)."
            exit 1
          fi
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still the placeholder (README, Updates)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Kulki ${{ needs.prepare.outputs.tag }}
          releaseBody: Instalatory dla Windows, macOS i Linuksa.
          releaseDraft: true
          # Signed update bundles and latest.json, merged across the matrix jobs.
          uploadUpdaterJson: true
          prerelease: false
          args: --bundles nsis

  # Publishing makes latest.json live, which is what installed apps look for. Reaching this
  # job means every installer built, and approving the tag was the decision to release it.
  publish:
    name: Publish the release
    needs: [prepare, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
