name: Full suite

# Run by hand from the Actions tab before a release. Pull requests only run pr.yml.
on:
  workflow_dispatch:

jobs:
  frontend:
    name: Vitest, React Testing Library, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Rules tests and the component tests (React Testing Library) all run under Vitest.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
