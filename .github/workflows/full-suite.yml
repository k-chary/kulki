name: Full suite

# Run by hand from the Actions tab, and by release.yml before it builds installers.
# Pull requests only run pr.yml.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  frontend:
    name: Vitest, React Testing Library, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Rules tests and the component tests (React Testing Library) all run under Vitest.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  storage:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        uses: ./.github/actions/tauri-deps
      # tauri-build checks that frontendDist exists.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
