name: Tauri system dependencies
description: Installs the Linux packages Tauri needs, with retries so a slow apt mirror does not hang the job.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null <<'CONF'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        CONF
        for attempt in 1 2 3; do
          if timeout 240 sudo -E apt-get update && \
             timeout 480 sudo -E apt-get install -y --no-install-recommends \
               libwebkit2gtk-4.1-dev build-essential libssl-dev \
               libayatana-appindicator3-dev librsvg2-dev patchelf; then
            exit 0
          fi
          echo "apt attempt $attempt failed, retrying"
          sleep 10
        done
        exit 1
